<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lab Wajah</title>
<!-- DEV SAJA: kalibrasi pipeline wajah server (CompreFace + MiniFASNet).
     Tidak ikut build production (bukan entry Vite), endpoint-nya pun mati di production. -->
<style>
  :root { --bg:#0b0f0d; --card:#121a16; --ink:#e6f4ea; --dim:#8aa396; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --line:#23332b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, sans-serif; padding:16px; }
  main { max-width:720px; margin:0 auto; display:grid; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  video.mirror { transform:scaleX(-1); }
  video { width:100%; border-radius:10px; background:#000; aspect-ratio:4/3; object-fit:cover; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { background:#1c2a23; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--ok); color:#04120a; border:none; font-weight:700; }
  button[aria-pressed="true"] { outline:2px solid var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--dim); font-size:12px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  ol { margin:0; padding-left:20px; color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { border-bottom:1px solid var(--line); padding:4px; text-align:left; }
  input { background:#0a0f0d; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px; font:inherit; width:100%; }
</style>
</head>
<body>
<main>
  <h1>Lab Wajah — kalibrasi</h1>
  <div class="card">
    <video id="v" autoplay playsinline muted></video>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="start">Nyalakan kamera</button>
      <button id="flip">Putar kamera (depan/belakang)</button>
      <button id="ref">Jadikan acuan (wajah asli, depan)</button>
      <button id="auto" aria-pressed="false">Analisis terus</button>
    </div>
  </div>
  <div class="card grid">
    <div class="stat"><span>Wajah</span><b id="sFaces">–</b></div>
    <div class="stat"><span>Liveness (asli ≥ <i id="cLive">?</i>)</span><b id="sLive">–</b></div>
    <div class="stat"><span>Arah hadap</span><b id="sTurn">–</b></div>
    <div class="stat"><span>Similarity vs acuan (cocok ≥ <i id="cMatch">?</i>)</span><b id="sSim">–</b></div>
    <div class="stat"><span>Waktu server</span><b id="sMs">–</b></div>
  </div>
  <div class="card">
    <b>Skenario tes</b> — tekan "Jadikan acuan" SEKALI, lalu tekan tombol skenario 3–5× masing-masing:
    <div class="row" style="margin-top:8px">
      <button class="scn" data-label="depan">Depan</button>
      <button class="scn" data-label="noleh-kiri">Noleh ke KIRI-mu</button>
      <button class="scn" data-label="noleh-kanan">Noleh ke KANAN-mu</button>
      <button class="scn" data-label="layar-hp">Fotoku di layar HP</button>
      <button class="scn" data-label="foto-cetak">Foto cetak</button>
      <button class="scn" data-label="orang-lain">Orang lain</button>
    </div>
    <p id="refInfo" style="color:var(--dim);margin:8px 0 0">Acuan: belum ada.</p>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>Log</b><button id="copy">Salin log</button>
    </div>
    <table><thead><tr><th>label</th><th>wajah</th><th>px</th><th>live</th><th>arah</th><th>sim</th></tr></thead><tbody id="log"></tbody></table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const v = $('v');
let ref = null; let timer = null; let busy = false; const rows = [];

let facing = 'user';
const startCam = async () => {
  v.srcObject?.getTracks().forEach((t) => t.stop());
  v.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
  });
  // Pratinjau dicermin hanya utk kamera depan (spt cermin); frame yg dikirim tetap tidak dicermin.
  v.classList.toggle('mirror', facing === 'user');
  $('flip').textContent = facing === 'user' ? 'Putar ke kamera belakang' : 'Putar ke kamera depan';
};
$('start').onclick = startCam;
// Kamera belakang dipakai utk mengarahkan HP ke foto di layar laptop (tes spoof).
// Catatan: arah noleh (+/−) hanya bermakna utk kamera depan.
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };

// Frame TIDAK dicermin (preview saja yang dicermin via CSS) — sama dgn yang akan dikirim app.
const grab = () => {
  const c = document.createElement('canvas');
  const s = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
};

const analyze = async (label, asRef = false) => {
  if (busy || !v.videoWidth) return;
  busy = true;
  try {
    const r = await fetch('/api/dev/face-analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: grab(), ref, label }),
    });
    const j = await r.json();
    if (!r.ok) { $('sFaces').textContent = j.error ?? 'error'; return; }
    show(j);
    if (asRef && j.faces === 1) {
      ref = { calculator: j.calculator, embedding: j.embedding };
      $('refInfo').textContent = `Acuan: terkunci (${new Date().toLocaleTimeString()}).`;
    }
    const row = { label, faces: j.faces, px: j.width ?? null, live: j.live ?? null, turn: j.turn ?? null, sim: j.similarity ?? null };
    rows.push(row);
    const fmt = (x, d = 3) => (x === null || x === undefined ? '–' : Number(x).toFixed(d));
    $('log').insertAdjacentHTML('afterbegin',
      `<tr><td>${label}</td><td>${row.faces}</td><td>${row.px ?? '–'}</td><td>${fmt(row.live)}</td><td>${fmt(row.turn)}</td><td>${fmt(row.sim)}</td></tr>`);
  } finally { busy = false; }
};

const show = (j) => {
  $('sFaces').textContent = j.faces;
  if (j.faces !== 1) { ['sLive', 'sTurn', 'sSim'].forEach((k) => ($(k).textContent = '–')); $('sMs').textContent = '–'; return; }
  const c = j.cfg;
  $('cLive').textContent = c.liveMin; $('cMatch').textContent = c.matchMin;
  $('sLive').textContent = j.live.toFixed(3);
  $('sLive').className = j.live >= c.liveMin ? 'ok' : 'bad';
  // turn + = hidung ke kanan GAMBAR = kiri PENGGUNA (frame tidak dicermin).
  const a = Math.abs(j.turn);
  const arah = a <= c.frontalMax ? 'depan' : a >= c.turnMin ? (j.turn > 0 ? 'noleh kiri-mu' : 'noleh kanan-mu') : 'agak miring';
  $('sTurn').textContent = `${j.turn >= 0 ? '+' : ''}${j.turn.toFixed(3)} ${arah}`;
  $('sTurn').className = a <= c.frontalMax || a >= c.turnMin ? 'ok' : 'warn';
  $('sSim').textContent = j.similarity === null ? 'belum ada acuan' : j.similarity.toFixed(3);
  $('sSim').className = j.similarity === null ? '' : j.similarity >= c.matchMin ? 'ok' : 'bad';
  $('sMs').textContent = `${j.ms} ms`;
};

// Acuan tidak boleh terganti tanpa sengaja (similarity dibandingkan ke sini).
$('ref').onclick = () => {
  if (ref && !confirm('Ganti acuan dengan frame sekarang?')) return;
  analyze('acuan', true);
};
document.querySelectorAll('.scn').forEach((b) => { b.onclick = () => analyze(b.dataset.label); });
const stopAuto = () => { clearInterval(timer); timer = null; $('auto').setAttribute('aria-pressed', 'false'); };
$('auto').onclick = () => {
  if (timer) return stopAuto();
  $('auto').setAttribute('aria-pressed', 'true');
  timer = setInterval(() => analyze('terus'), 700);
};
// Layar mati / pindah aplikasi → kamera beku; jangan kirim frame basi.
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAuto(); });
$('copy').onclick = () => navigator.clipboard.writeText(rows.map((r) => JSON.stringify(r)).join('\n'));
</script>
</body>
</html>
