# piket-menwa — PWA statis dari VPS, /api & /uploads lewat tunnel SSH ke mini PC (127.0.0.1:18090 -> mini PC :3110).
# Tunnel: piket-tunnel.service (user dracarys di mini PC), terpisah dari tunnel-vps.service.

# Batasi tebak-tebakan PIN admin/superadmin (per IP asli).
limit_req_zone $binary_remote_addr zone=piket_pinverify:10m rate=10r/m;
map "$http_x_admin_pin$http_x_super_pin" $piket_pin_key { "" ""; default $binary_remote_addr; }
limit_req_zone $piket_pin_key zone=piket_pinheader:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=piket_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name piket.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name piket.example.com;

    ssl_certificate /etc/letsencrypt/live/piket.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piket.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/piket-menwa;
    client_max_body_size 12m;   # server: express.json limit 12mb (foto dataURL)
    limit_req_status 429;

    # --- PWA statis ---
    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location /assets/         { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /                { try_files $uri $uri/ /index.html; }

    # --- API lewat tunnel ---
    location ~ ^/api/(admin|super)/verify$ {
        limit_req zone=piket_pinverify burst=5 nodelay;
        include /etc/nginx/snippets/piket-proxy.conf;
    }
    location /api/ {
        limit_req zone=piket_api burst=40 nodelay;
        limit_req zone=piket_pinheader burst=30 nodelay;
        include /etc/nginx/snippets/piket-proxy.conf;
    }
    location /uploads/ {
        include /etc/nginx/snippets/piket-proxy.conf;
    }
}
