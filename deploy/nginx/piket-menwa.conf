# CONTOH — ganti piket.example.com dengan domain produksi (nilai asli tidak disimpan di repo).
# piket-menwa — SEMUA (frontend, /api, /uploads) di VPS Helipod, lewat tunnel SSH:
# 127.0.0.1:18091 di sini -> nginx 127.0.0.1:8080 di VPS Helipod (piket-tunnel.service di sana, user root).
# SSL, rate limit & IP asli tetap di sini. Mini PC tidak lagi menjalankan piket-menwa (sejak 5 Okt 2026).

# Batasi tebak-tebakan PIN admin/superadmin (per IP asli).
limit_req_zone $binary_remote_addr zone=piket_pinverify:10m rate=10r/m;
map "$http_x_admin_pin$http_x_super_pin" $piket_pin_key { "" ""; default $binary_remote_addr; }
limit_req_zone $piket_pin_key zone=piket_pinheader:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=piket_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name piket.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name piket.example.com;

    ssl_certificate /etc/letsencrypt/live/piket.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piket.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;   # server: express.json limit 12mb (foto dataURL)
    limit_req_status 429;

    # --- APK sideload (tetap di VPS ini) ---
    location /unduh/ {
        alias /var/www/piket-menwa-unduh/;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    # --- API (rate limit di sini, per IP asli) ---
    location ~ ^/api/(admin|super)/verify$ {
        limit_req zone=piket_pinverify burst=5 nodelay;
        include /etc/nginx/snippets/piket-proxy.conf;
    }
    location /api/ {
        limit_req zone=piket_api burst=40 nodelay;
        limit_req zone=piket_pinheader burst=30 nodelay;
        include /etc/nginx/snippets/piket-proxy.conf;
    }

    # --- frontend PWA & /uploads (header cache diatur nginx VPS Helipod) ---
    location / {
        include /etc/nginx/snippets/piket-proxy.conf;
    }
}
