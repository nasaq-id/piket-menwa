# /etc/nginx/sites-available/piket-menwa di VPS app. Publik: nginx VPS publik (SSL, rate limit, IP asli) -> tunnel SSH -> 127.0.0.1:8080 di sini.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /opt/piket-menwa/dist;
    client_max_body_size 12m;

    location = /sw.js         { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-cache"; }
    location /assets/         { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /                { try_files $uri $uri/ /index.html; }

    location ~ ^/(api|uploads)/ {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP asli sudah ditulis nginx VPS publik; teruskan apa adanya (Express trust proxy = loopback).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
